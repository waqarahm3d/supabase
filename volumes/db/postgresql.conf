# PostgreSQL configuration optimized for 4GB RAM / 2 CPU server
# This configuration is tuned for a small to medium workload

#------------------------------------------------------------------------------
# RESOURCE USAGE (except WAL)
#------------------------------------------------------------------------------

# Memory Configuration (optimized for 4GB total RAM)
# Rule of thumb: 25% of total RAM for shared_buffers on dedicated server
shared_buffers = 1GB

# Effective cache size - estimate of memory available for disk caching
# This should be about 50-75% of total RAM
effective_cache_size = 3GB

# Memory for complex sorts and hash tables per operation
# Total work_mem can be used by multiple operations simultaneously
work_mem = 16MB

# Memory for maintenance operations (VACUUM, CREATE INDEX, etc.)
maintenance_work_mem = 256MB

#------------------------------------------------------------------------------
# WRITE AHEAD LOG
#------------------------------------------------------------------------------

# WAL settings for better performance with acceptable durability
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# Checkpoint settings to reduce I/O spikes
checkpoint_completion_target = 0.9

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------

# Cost-based optimizer settings
random_page_cost = 1.1  # Assumes SSD storage
effective_io_concurrency = 200  # For SSD

# Parallel query settings (2 CPU cores available)
max_worker_processes = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1
max_parallel_workers = 2

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

# Connection settings - limited for 4GB RAM
# Each connection uses memory, so we limit this
max_connections = 100

# Supabase required settings
listen_addresses = '*'
port = 5432

#------------------------------------------------------------------------------
# AUTOVACUUM PARAMETERS
#------------------------------------------------------------------------------

# Autovacuum settings for better table maintenance
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 10s

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------

# Minimal logging to save resources
log_min_duration_statement = 1000  # Log queries taking longer than 1 second
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'UTC'

#------------------------------------------------------------------------------
# LOCALE AND FORMATTING
#------------------------------------------------------------------------------

datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'

#------------------------------------------------------------------------------
# SUPABASE SPECIFIC
#------------------------------------------------------------------------------

# Required for Supabase extensions
# Simplified list - only essential extensions that are guaranteed to work
# Additional extensions can be loaded later via CREATE EXTENSION if needed
shared_preload_libraries = 'pg_stat_statements'

# Extension settings
pg_stat_statements.track = all

# pgsodium configuration (if you need encryption features)
# Uncomment these lines after initial setup succeeds:
# pgsodium.getkey_script = '/usr/lib/postgresql/15/bin/pgsodium_getkey.sh'

# Security settings
password_encryption = 'scram-sha-256'
ssl = off  # Enable if you have SSL certificates configured

# Performance monitoring
compute.pgrst_db_schema = 'public, storage'
